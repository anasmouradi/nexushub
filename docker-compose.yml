services:
  postgres:
    image: postgres:16
    container_name: nexushub-db
    environment:
      POSTGRES_DB: nexushub
      POSTGRES_USER: nexushub
      POSTGRES_PASSWORD: nexushub
    ports:
      - "5432:5432"
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
